<html>
<head>
<title>parameters</title>
</head>
<body>
<script>
let oddoreven = function (number) {
if (number% 2 == 0 ) {
document.write(number +" is even number");
} else {
document.write(number +" is an odd number");
}
}
let number = prompt("enter the number:");
oddoreven(number);
</script>
</body>
</html>
