<html lang="en">
<head>
<title>my jungle explorer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
body {position: relative;
.jungle-slide {
height: 200px;
text-align: center;
padding-top: 75px;
font-size: 1.8rem;
color: crimson;
}
.slide-rainforest {background-color: forestgreen;}
.slide-river {background-color: steelblue;}
.slide-night {background-color: black;}
.section {
padding: 70px 20px;
min-height: 300px;
}
#rainforest {background-color: honeydew;}
#river {background-color: blueviolet;}
#night {background-color: lavenderblush;}
</style>
</head>
<body data-spy="scroll" data-target="#junglenav" data-offset="60">
<div id="jungle carousel" class="carousel-slide" data-ride="carousel">
<ol class="carousel-indicators">
<li data-target="#junglecarousel" data-slide-to="0" class="active"></li>
<li data-target="#junglecarousel" data-slide-to="1"></li>
<li data-target="#junglecarousel" data-slide-to="2"></li>
</ol>
<div class="carousel-inner">
<div class="carousel-item active jungle-slide slide-rainforest">
rainforest adventure
</div>
<div class="carousel-inner">
    <div class="carousel-item jungle-slide slide-river">
    jungle river journey
    </div>
<div class="carousel-inner">
    <div class="carousel-item jungle-slide slide-night">
    night jungle safari
    </div>
</div>
<a class="carousel-control-prev" href="#junglecarousel data-slide="prev"></a>
<span carousel-control-prev-icon></span>
<a class="carousel-control-prev" href="#junglecarousel data-slide=" prev"></a>
<span carousel-control-prev-icon></span>
</div>
<nav id="junglenav" class="navbar navbar-expand-sm navbar-dark bg-dark sticky-top">
<span class="navbar-brand">jungle explorer</span>
