<html>
    <body>
    <section>
       <img class="myslides"  src="pic.webp" style="height: 500px;"">
    <img class="myslides" src="pic2.jpg" style="height: 500px;"">
    </section>
    <script>
    var myindex = 0;
    carousel();
    function carousel() {
    var i;
    var x = document.getELementsbyclassname("myslides");
    for (i = 0; i < x.length; i++) {
    x[i].style.display = none;
    }
    myindex++;
    if (myindex > x.length) {myIndex = 1}
    x[myindex-1].style.display = "block";
    setTimeout(carousel, 3000);
}
</script>
</body>
</html>
